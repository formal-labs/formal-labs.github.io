<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="icon" href="{{ "favicon.ico" | relURL }}">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
<style>
:root {
  --link: #14477a;
  --rule: #222;
}
html { font-size: 17.5px; }
body {
  background-color: #e9e7e0;
  color: #111;
  font-family: "Times New Roman", Times, serif;
  font-size: 1rem;
  line-height: 1.45;
  margin: 0;
  padding: 1.25rem 1.5rem;
}
a { color: var(--link); }
h1 { margin: 0 0 0.75rem; font-size: 1.75rem; }
h2 { font-size: 1.25rem; margin-top: 1.75rem; }

/* Navigation bar */
nav.site-nav {
  margin: 0 0 2rem;
  padding-bottom: 0.5rem;
  border-bottom: 0.09rem solid var(--rule);
}
nav.site-nav ul {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 1.75rem;
  margin: 0;
  padding: 0;
}
nav.site-nav a {
  text-decoration: none;
  color: #111;
  font-size: 1.25rem;
}
nav.site-nav a:hover { text-decoration: underline; }

/* Seminar talk blocks */
.talk { margin: 0 0 1.1em; }
.talk .theme { font-weight: 600; }
.talk .speaker { font-style: italic; }
.talk .abstract { margin: 0.4em 0 0 2em; text-align: justify; }
</style>
</head>
<body>
<nav class="site-nav">
<ul>
{{ range .Site.Menus.main }}
<li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
{{ end }}
</ul>
</nav>
{{ block "main" . }}{{ end }}
</body>
</html>
