<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="icon" href="{{ "favicon.ico" | relURL }}">
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}">
<style>
:root {
  --academic-blue: #0056b3;
  --border-color: #ddd;
  --text-main: #333;
}
body {
  background-color: #F8ECC2;
  color: #000;
  font-family: "Times New Roman", Times, serif;
  font-size: 16px;
  margin: 0;
  padding: 1rem;
}
a { color: var(--academic-blue); }
h1 { margin-top: 0; }

/* Navigation bar */
nav.math-nav {
  padding: 0.6rem 0;
  margin: 0.75rem 0 1.5rem;
  border-top: 0.0625rem solid var(--border-color);
  border-bottom: 0.0625rem solid var(--border-color);
}
nav.math-nav ul {
  list-style: none;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  margin: 0;
  padding: 0;
}
nav.math-nav li { margin: 0.5em 1em; }
nav.math-nav a {
  text-decoration: none;
  color: var(--text-main);
  font-variant: small-caps;
  font-size: 1.1rem;
  letter-spacing: 0.03em;
}
nav.math-nav a:hover { color: var(--academic-blue); border-bottom: 0.07em solid var(--academic-blue); }

/* Seminar talk blocks */
.talk { margin: 0 0 1em; }
.talk .theme { font-weight: 600; }
.talk .speaker { font-style: italic; }
.talk .abstract { margin: 0.4em 0 0 2em; text-align: justify; }
</style>
</head>
<body>
<nav class="math-nav">
<ul>
{{ range .Site.Menus.main }}
<li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
{{ end }}
</ul>
</nav>
{{ block "main" . }}{{ end }}
</body>
</html>
